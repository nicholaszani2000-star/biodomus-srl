<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 301 272" width="301" height="272" role="img" aria-labelledby="bdst" class="bds"><title id="bdst">Parete in prospettiva: isolante esterno, calcestruzzo armato, isolante interno, intonaco</title><style>.bds-l{fill:none;stroke:var(--bd-testo,#1F2326);stroke-width:1.3;stroke-linejoin:round}.bds-pieno{fill:var(--bd-carta,#F8F7F5)}.bds-ombra1{fill:var(--bd-testo,#1F2326);fill-opacity:.07}.bds-ombra2{fill:var(--bd-testo,#1F2326);fill-opacity:.15}.bds-retino{fill:none;stroke:var(--bd-testo-2,#595E62);stroke-width:.9}.bds-punto{fill:var(--bd-testo-2,#595E62)}.bds-tondino{fill:var(--bd-tondino,#B4542D);stroke:var(--bd-testo,#1F2326);stroke-width:.8}.bds-q{fill:none;stroke:var(--bd-dettaglio,#A87B4F);stroke-width:1.4;stroke-linecap:round}.bds .bd-strato{transform:translateX(calc(var(--bd-esplodi,0) * var(--bd-stacco,0px)))}.bds .bd-strato-1{--bd-stacco:-36px}.bds .bd-strato-2{--bd-stacco:-12px}.bds .bd-strato-3{--bd-stacco:12px}.bds .bd-strato-4{--bd-stacco:36px}.bds-quote{opacity:calc(1 - var(--bd-esplodi,0))}.bd-tema-scuro .bds-luce{filter:url(#bds-alone)}@media (prefers-reduced-motion:reduce){.bds .bd-strato{transform:none}.bds-quote{opacity:1}}</style><defs><pattern id="bds-eps" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 6Q3 0 6 6T12 6" class="bds-retino" opacity=".6"/></pattern><pattern id="bds-cls" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r=".9" class="bds-punto" opacity=".6"/><path d="M9 8.5l2.4 3.9H6.6Z" class="bds-retino" opacity=".55"/><circle cx="11.5" cy="2.5" r=".6" class="bds-punto" opacity=".55"/></pattern><pattern id="bds-int" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".55" class="bds-punto" opacity=".7"/></pattern><filter id="bds-alone" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g cla