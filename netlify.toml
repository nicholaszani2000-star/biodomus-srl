# Netlify pubblica solo dist/ (CLAUDE.md §1).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 richiede Node 20.19+ o 22.12+
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Header di sicurezza per tutte le pagine (step 7). Valgono per i file che Netlify serve dal suo archivio,
# non per le risposte delle funzioni. L'anteprima (studio/anteprima-server.mts) li legge da qui.
# Content-Security-Policy:
# - script-src: solo il sito, lo script dell'angolo con il suo hash e lo script del pixel di Meta,
#   che bd-traccia carica solo dopo il consenso;
# - style-src: solo il sito e gli hash dei tre <style> dei disegni della parete;
#   gli hash li calcola e li scrive scripts/prerender.mjs a ogni build;
# - img-src e connect-src: gli eventi del pixel verso www.facebook.com (e connect.facebook.net);
# - niente 'unsafe-inline'; il modulo senza JavaScript invia a /api/lead (form-action 'self').
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-Hloeo74i4lQL0HbaxVRf7IhRbwbKgAcr42dkez05nxo=' https://connect.facebook.net; style-src 'self' 'sha256-fPnlzAkU9SOZdmVRftlPVlXPZWOP5FerS84NV/YO/G0=' 'sha256-+0L7UaUdlS809iWumum4G33fDkeKWAbT4DO4+p+eD3c=' 'sha256-UCol3mpWqcMO5BWsYk7hVooRZFKcV5IuHcCuo9ZT5WM='; img-src 'self' https://www.facebook.com; connect-src 'self' https://connect.facebook.net https://www.facebook.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# File con l'hash nel nome (Vite): cache di un anno, immutabile
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
